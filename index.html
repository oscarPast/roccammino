<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gruppo di Cammino</title>
</head>
<body>
  <aside id="panel">
    <header>
      <h1>Gruppo cammino di Rocca Arazzo</h1>
      <p>Diario dei cammini</p>
    </header>

    <section aria-label="Cerca" class="search">
      <input id="search" type="search" placeholder="Cerca un percorso…" autocomplete="off"
             aria-label="Cerca un percorso per nome" />
    </section>

    <section aria-label="Percorsi">
      <h2 id="count"></h2>
      <ul id="routeList"></ul>
    </section>

  </aside>

  <button id="togglePanel" aria-expanded="true">
    Nascondi pannello ▲
  </button>

  <main id="map" aria-label="Mappa"></main>
  <aside id="sheet" hidden aria-label="Dettaglio del percorso"></aside>
  <div id="report" hidden role="dialog" aria-modal="true" aria-labelledby="reportTitle">
    <div class="report-bar">
      <strong id="reportTitle"></strong>
      <button id="reportPdf">Esporta PDF</button>
      <button id="reportClose" aria-label="Chiudi la relazione">×</button>
    </div>
    <article id="reportDoc" class="report-doc"></article>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
