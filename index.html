<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gruppo di Cammino</title>
</head>
<body>
  <aside id="panel">
    <header>
      <h1>Gruppo cammino di Rocca Arazzo</h1>
      <p>Diario dei cammini</p>
    </header>

    <section aria-label="Lunghezza">
      <label class="range">
        Lunghezza massima: <output id="kmOut">20</output> km
        <input id="km" type="range" min="1" max="20" value="20" />
      </label>
    </section>

    <section aria-label="Percorsi">
      <h2 id="count"></h2>
      <ul id="routeList"></ul>
    </section>

  </aside>

  <button id="togglePanel" aria-expanded="true">
    Nascondi pannello ▲
  </button>

  <main id="map" aria-label="Mappa"></main>
  <aside id="sheet" hidden aria-label="Dettaglio del percorso"></aside>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
