<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gruppo di Cammino</title>
  <script type="module" crossorigin src="./assets/index-DKW5ibPl.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CjYJ9NQX.css">
</head>
<body>
  <aside id="panel">
    <header>
      <h1>Gruppo cammino di Rocca Arazzo</h1>
      <p>Diario dei cammini</p>
    </header>

    <section aria-label="Filtri">
      <fieldset>
        <legend>Difficoltà</legend>
        <label><input type="checkbox" name="diff" value="facile" checked /> Facile</label>
        <label><input type="checkbox" name="diff" value="media" checked /> Media</label>
        <label><input type="checkbox" name="diff" value="impegnativa" checked /> Impegnativa</label>
      </fieldset>

      <fieldset>
        <legend>Tema</legend>
        <label><input type="checkbox" name="theme" value="storia" checked /> Storia</label>
        <label><input type="checkbox" name="theme" value="ambiente" checked /> Ambiente</label>
        <label><input type="checkbox" name="theme" value="cultura" checked /> Cultura</label>
      </fieldset>

      <label class="range">
        Lunghezza massima: <output id="kmOut">20</output> km
        <input id="km" type="range" min="1" max="20" value="20" />
      </label>
    </section>

    <section aria-label="Percorsi">
      <h2 id="count"></h2>
      <ul id="routeList"></ul>
    </section>

    <section class="actions">
      <button id="locate">Dove sono</button>
      <button id="simulate">Simula cammino</button>
    </section>
  </aside>

  <button id="togglePanel" aria-expanded="true">
    Nascondi pannello ▲
  </button>

  <main id="map" aria-label="Mappa"></main>
  <div id="toast" role="status" aria-live="polite" hidden></div>

</body>
</html>
